# ThunderAfkZone configuration

global:
  # When multiple rewards are eligible at the same moment:
  # "all"     - give every eligible reward
  # "highest" - give only the reward(s) with the highest priority
  on_multiple: "all"

  # Seconds of inactivity before a player is considered AFK for rewards
  afk_threshold_seconds: 60

  # Sounds (Bukkit Sound enum names). Invalid names are warned on reload.
  enter_sound: "ENTITY_PLAYER_LEVELUP"
  exit_sound: "ENTITY_ITEM_BREAK"
  reward_sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  sound_volume: 1.0
  sound_pitch: 1.0

  # Timer display settings for AFK reward countdown
  timer:
    enabled: true
    template: "<yellow><bold>Next reward in <timer></bold></yellow>"
    # title | actionbar | chat | bossbar
    display: "title"
    # big | mini  (affects title/actionbar/chat styling)
    size: "big"
    title:
      fade_in: 5
      stay: 40
      fade_out: 5

  # Player-facing messages (MiniMessage). Placeholders: <zone>, <reward>, <timer>, <player>
  messages:
    enter_zone: "<green>Entered AFK zone: <yellow><zone></yellow></green>"
    exit_zone: "<gray>You left AFK zone: <yellow><zone></yellow></gray>"
    reward_received: "<gold>You received reward: <yellow><reward></yellow></gold>"
    reward_failed: "<red>Reward '<reward>' could not be delivered. Please contact staff.</red>"

# Reward definitions
# executor: "give" | "itemedit" | "itemadder" | "console"
#   give      -> /give <player> <item> <amount>
#   itemedit  -> /si give <player> <item> <amount>
#   itemadder -> /itemadder give <player> <item> <amount>
#   console   -> arbitrary console command (use "command:" field with {player} placeholder)
#
# interval_seconds   : repeat every X seconds (0 = disabled)
# once_after_seconds : give once after X seconds (0 = disabled)
# priority           : used when on_multiple = "highest"
# enabled            : false pauses the reward without deleting it

rewards:
  welcome_diamond:
    description: "Give a diamond to the player"
    executor: "give"
    item: "diamond"
    amount: 1
    interval_seconds: 0
    once_after_seconds: 0
    priority: 5
    enabled: true

  starter_kit:
    description: "Give starter items via ItemEdit"
    executor: "itemedit"
    item: "starter_item"
    amount: 1
    interval_seconds: 0
    once_after_seconds: 0
    priority: 1
    enabled: true
