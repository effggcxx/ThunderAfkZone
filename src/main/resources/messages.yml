# ============================================================
# ThunderAfkZone - Messages Configuration
# ============================================================
# All player-facing messages are configurable here.
# Each regular message has:
#   text:    The message content (MiniMessage format)
#   display: How to show it - "chat" | "title" | "actionbar" | "bossbar"
#
# The timer message supports these extra options:
#   size: "big" or "mini"
#   title.fade_in, title.stay, title.fade_out (only used when the timer is shown as a title)
#
# Placeholders:
#   <zone>   - Zone name
#   <reward> - Reward name
#   <timer>  - Time until next reward (e.g. "5:00")
#   <player> - Player name
# ============================================================
# I highly recommend checking this documentation to fully utilize configurable messages :
# https://docs.papermc.io/adventure/minimessage/format/
# Message shown when entering a zone
enter_zone:
  text: "<c:green><b><shadow:black:1>You entered AFK zone"
  display: "title"

# Message shown when leaving a zone
exit_zone:
  text: "<c:dark_red><shadow:black:1><b>You left AFK zone"
  display: "title"

# Message shown when a reward is received
reward_received:
  text: "<c:gold><shadow:black:1><b>You received a reward!"
  display: "title"

# Message shown when a reward fails to deliver
reward_failed:
  text: "<c:dark_red><shadow:black:1><b><hover:show_text:'<red>Please Contact Staff.'>Reward '<reward>' could not be delivered."
  display: "chat"

# Message shown when the player's inventory is full and the reward drops on the ground
inventory_full:
  text: "<c:dark_red><shadow:black:1><b>Your inventory was full! Reward '<reward>' fell on the ground."
  display: "chat"

# Timer countdown shown while in a zone
timer:
  text: "<gradient:#aa00aa:#ff55ff><b><timer> remaining until next reward"
  display: "bossbar"
  size: "big"           # "big" or "mini"