# ============================================================
# ThunderAfkZone zone definitions
# ============================================================
# Each zone defines a cuboid region. Players standing inside
# an AFK zone while idle will receive rewards.
#
# Create a zone with: /afkzone create <name>
# (select the region with the wand tool: /afkzone wand)
#
# Zone format:
#   zones:
#     <zone_name>:
#       world: "world"
#       x1: 0    y1: 0    z1: 0
#       x2: 0    y2: 0    z2: 0
#       rewards:                     # optional: restrict which global
#         - "reward_name"            # rewards apply in this zone
#       on_enter:
#         commands:                  # console commands on zone entry
#           - "say {player} entered {zone}"
#       on_exit:
#         commands:                  # console commands on zone exit
#           - "say {player} left {zone}"
#       # Available placeholders in on_enter/on_exit commands: {player} {zone} {uuid}
#
# Per-zone config overrides (optional):
#   These override the matching keys in config.yml for players
#   inside this zone:
#       afk_threshold_seconds: 30   # idle seconds before rewards tick (0 = presence only)
#       enter_sound: "ENTITY_EXPERIENCE_ORB_PICKUP"   # plays on entry; set to "none" to mute
#       exit_sound: "none"                            # "none" disables the sound for this zone
#       reward_sound: "ENTITY_PLAYER_LEVELUP"         # plays when a reward is given
#       timer.enabled: false                          # disable countdown timer for this zone
#
# Example zone with overrides:
#   spawn_afk:
#     world: "world"
#     x1: -10    y1: 60    z1: -10
#     x2: 10     y2: 70    z2: 10
#     afk_threshold_seconds: 30
#     enter_sound: "BLOCK_NOTE_BLOCK_PLING"
#     exit_sound: "none"
#     reward_sound: "ENTITY_PLAYER_LEVELUP"
#     timer.enabled: true
#     rewards:
#       - "welcome_diamond"
#       - "starter_kit"
#     on_enter:
#       commands:
#         - "effect give {player} minecraft:speed 60 0"
#     on_exit:
#       commands:
#         - "effect clear {player} minecraft:speed"
# ============================================================

zones: {}