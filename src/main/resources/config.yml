# ============================================================
# ThunderAfkZone configuration
# ============================================================

# Wand selection tool - used to define zone boundaries.
# Get it in-game with /afkzone wand, then:
#   left-click a block  = set corner 1
#   right-click a block = set corner 2
# /afkzone sel shows your current selection; /afkzone create <name> creates
# the zone from it and clears the selection; /afkzone cancel clears it
# without creating anything.
# Only players with the afkzone.wand permission are affected when holding
# this item - everyone else can use it (e.g. till farmland with a hoe)
# completely normally.
wand:
  # The item used as the selection wand (Bukkit Material enum). Pick
  # something players don't normally hold if you want to avoid any chance
  # of confusion, even for staff who forget they're holding it.
  item: "WOODEN_HOE"

# Border visualization - /afkzone border toggles particle borders around zones.
# Particles are only visible to the player who enabled them.
border:
  # Particle type (Bukkit Particle enum name). Simple particles work best.
  # Examples: END_ROD, FLAME, HAPPY_VILLAGER, CRIT, HEART, SOUL
  # Note: particles that require extra data (DUST, BLOCK, ITEM) may not render.
  particle: "END_ROD"
  # How often to refresh particles, in ticks (20 ticks = 1 second)
  interval_ticks: 10
  # Distance between particles along edges, in blocks (lower = denser)
  density: 1.0
  # Maximum distance (in blocks) from a zone center to show its border
  render_distance: 64
  # Draw the full 3D box (all 12 edges) or just the ground outline (4 bottom edges)
  full_box: false
  # Maximum particles per edge (prevents excessive particles on very large zones)
  max_particles_per_edge: 200

global:
  # When multiple rewards become eligible at the same second:
  #   "all"     → give every eligible reward
  #   "highest" → give only the reward(s) with the highest priority
  on_multiple: "all"

  # Whether leaving a zone resets progress toward interval/once-after rewards.
  #   true  (default) - leaving (even briefly) resets all reward progress back
  #                      to zero, same as re-entering fresh. The current-session
  #                      timer (%afkzone_time%) always resets regardless of
  #                      this setting - it's tracking "time in the zone right
  #                      now", not reward progress.
  #   false            - reward progress (interval counters and which
  #                       once-after rewards have already been given) is kept
  #                       when a player leaves and picked back up if/when they
  #                       return, instead of restarting every timer from zero.
  #                       Useful if players commonly get bumped out briefly
  #                       (server hiccups, accidental steps out of the zone)
  #                       and losing all progress each time feels punishing.
  #                       When using SQLite storage, progress is periodically
  #                       saved and persists across server restarts.
  reset_progress_on_leave: true

  # Seconds of inactivity required before a player is considered AFK and
  # reward progress starts ticking. Activity = block movement, chat, commands,
  # or interacting with blocks/entities. Entering a zone counts as activity, so
  # the player must stay idle for this many seconds after entering (or after
  # any action) before timers advance.
  #   0  = default — no threshold, simply being inside the zone is enough
  #        (presence mode)
  #  60  = must be idle for 1 minute before progress starts ticking
  # Can be overridden per-zone in zones.yml via afk_threshold_seconds.
  afk_threshold_seconds: 0

  # Storage backend: "sqlite" (persistent) or "memory" (resets on restart).
  # "sqlite" requires the driver declared in plugin.yml's `libraries:` block -
  # check your startup log for "SQLite storage initialized"; if you see a
  # failure warning instead, switch this to "memory" until it's resolved.
  storage: "sqlite"

  # Sounds (Bukkit Sound enum names). Invalid names are warned on reload and disabled.
  enter_sound: "ENTITY_PLAYER_LEVELUP"
  exit_sound: "ENTITY_ITEM_BREAK"
  reward_sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
  sound_volume: 1.0
  sound_pitch: 1.0

  # Timer display is now configured in messages.yml
  timer:
    enabled: true

# ============================================================
# Rewards are no longer defined in this file.
# Use /afkzone reward save <name> while holding an item to
# create rewards in-game. They are saved in the rewards/
# folder as individual YAML files.
#
# Examples:
#   /afkzone reward save welcome_diamond 1 300
#     → 1 of held item every 5 minutes of AFK
#   /afkzone reward save starter_kit 1 false 60
#     → 1 of held item once after 60 seconds of AFK
#   /afkzone reward save vip_kit 1 300 60 10
#     → once after 60s, then every 5 min (priority 10)
#
# interval=0 AND once_after=0 is rejected — the reward would never fire.
# Manage rewards with:
#   /afkzone reward list
#   /afkzone reward remove <name>
#   /afkzone reward enable|disable|toggle <name>
# ============================================================
# Legacy reward definitions (from config.yml) are no longer read.
# Existing rewards from config.yml should be re-created using
# the /afkzone reward save command.
