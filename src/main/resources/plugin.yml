name: ThunderAfkZone
version: 1.0.0
main: me.ehsan.afkzone.Main
api-version: "1.21"
softdepend: [WorldEdit, ItemEdit]
commands:
  afkzone:
    description: Manage AFK zones
    usage: /afkzone <create|list|info|remove|reload|reward|zonereward>
    aliases: [taz, thunderafk]
permissions:
  afkzone.create:
    description: Allows creating AFK zones with a WorldEdit selection
    default: op
  afkzone.list:
    description: Allows listing AFK zones
    default: op
  afkzone.info:
    description: Allows viewing zone info
    default: op
  afkzone.remove:
    description: Allows removing AFK zones
    default: op
  afkzone.reload:
    description: Allows reloading the AfkZone configuration
    default: op
  afkzone.reward.list:
    description: Allows listing configured rewards
    default: op
  afkzone.reward.give:
    description: Allows manually giving a configured reward to a player
    default: op
  afkzone.zonereward.list:
    description: Allows viewing per-zone reward assignments
    default: op
  afkzone.zonereward.add:
    description: Allows adding rewards to a zone
    default: op
  afkzone.zonereward.remove:
    description: Allows removing rewards from a zone
    default: op
  afkzone.zonereward.clear:
    description: Allows clearing all reward restrictions from a zone
    default: op
  afkzone.zonereward:
    description: Allows managing per-zone reward assignments (all sub-permissions)
    default: op
    children:
      afkzone.zonereward.list: true
      afkzone.zonereward.add: true
      afkzone.zonereward.remove: true
      afkzone.zonereward.clear: true
