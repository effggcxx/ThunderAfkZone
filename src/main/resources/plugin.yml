name: ThunderAfkZone
version: 1.0.0
main: me.ehsan.afkzone.Main
api-version: "1.21"
softdepend: [ItemEdit, PlaceholderAPI]
# Downloaded by Paper at startup and added to the plugin's classpath - required
# for global.storage: "sqlite" in config.yml to work (SqliteStorage uses this
# driver via Class.forName("org.sqlite.JDBC")). Without this, SQLite storage
# silently fails to initialize and every AFK tick throws on the null connection.
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.0
commands:
  afkzone:
    description: Manage AFK zones
    usage: /afkzone <create|list|info|remove|reload|reward|zonereward|stats|top>
    aliases: [taz, thunderafk]
permissions:
  afkzone.wand:
    description: Allows using the AFK zone wand selection tool
    default: op
  afkzone.create:
    description: Allows creating AFK zones with the wand selection tool
    default: op
  afkzone.list:
    description: Allows listing AFK zones
    default: op
  afkzone.info:
    description: Allows viewing zone info
    default: op
  afkzone.remove:
    description: Allows removing AFK zones
    default: op
  afkzone.reload:
    description: Allows reloading the AfkZone configuration
    default: op
  afkzone.reward.list:
    description: Allows listing configured rewards
    default: op
  afkzone.reward.give:
    description: Allows manually giving a configured reward to a player
    default: op
  afkzone.reward.save:
    description: Allows saving a held item as a reward
    default: op
  afkzone.zonereward.list:
    description: Allows viewing per-zone reward assignments
    default: op
  afkzone.zonereward.add:
    description: Allows adding rewards to a zone
    default: op
  afkzone.zonereward.remove:
    description: Allows removing rewards from a zone
    default: op
  afkzone.zonereward.clear:
    description: Allows clearing all reward restrictions from a zone
    default: op
  afkzone.zonereward:
    description: Allows managing per-zone reward assignments (all sub-permissions)
    default: op
    children:
      afkzone.zonereward.list: true
      afkzone.zonereward.add: true
      afkzone.zonereward.remove: true
      afkzone.zonereward.clear: true
  afkzone.stats:
    description: Allows viewing AFK statistics
    default: op
  afkzone.top:
    description: Allows viewing top AFK players
    default: op
  afkzone.admin:
    description: All ThunderAfkZone permissions
    default: op
    children:
      afkzone.wand: true
      afkzone.create: true
      afkzone.list: true
      afkzone.info: true
      afkzone.remove: true
      afkzone.reload: true
      afkzone.reward.list: true
      afkzone.reward.give: true
      afkzone.reward.save: true
      afkzone.zonereward: true
      afkzone.stats: true
      afkzone.top: true
